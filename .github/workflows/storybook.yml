name: Storybook

# Builds Storybook and deploys it to GitHub Pages (https://dmitrydyomin.github.io/wallet-web/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages reads the uploaded artifact through the Actions API.
  actions: read
  pages: write
  id-token: write

# Don't cancel a deploy that's in progress; queue the latest one after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
